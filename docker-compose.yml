# Local development: hot-reloading API + worker + web, with Redis.
# MongoDB is your Atlas cluster (vector search needs Atlas), set in apps/api/.env.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "2222:2222"
    env_file:
      - ./apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      - redis

  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run worker:dev"
    env_file:
      - ./apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      - redis
      - api

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "8080:8080"
    environment:
      VITE_BACKEND_URL: http://localhost:2222
      VITE_SOCKET_URL: http://localhost:2222
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
